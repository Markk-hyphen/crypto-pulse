<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Pulse — Live Market Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="pulse-body">

  <!-- NAV -->
  <nav id="navbar" class="nav-bar scrolled">
    <span class="nav-brand">Crypto Pulse</span>
    <div class="nav-actions">
      <a href="/" class="nav-btn">← Oliva</a>
      <a href="http://localhost/api/feed" class="nav-btn" target="_blank">API →</a>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="pulse-header">
    <div class="container">
      <p class="section-eyebrow light">Real-time · AI-enriched</p>
      <h1 class="section-title light">Market Pulse.<br /><em>As it happens.</em></h1>

      <div class="live-status">
        <span class="live-dot"></span>
        <span class="live-label">CONNECTING</span>
        <span class="live-sep">·</span>
        <span class="pulse-count">— items</span>
      </div>
    </div>
  </header>

  <!-- MARKET NOW -->
  <section class="pulse-main" style="padding-bottom: 1.5rem;">
    <div class="container">
      <div id="market-now" class="pulse-card">
        <div class="pulse-card-meta">
          <span class="pulse-source">Market Now</span>
        </div>
        <p class="pulse-summary pulse-summary--pending">Waiting for the first digest…</p>
      </div>
    </div>
  </section>

  <!-- FEED -->
  <main class="pulse-main">
    <div class="container">
      <div id="pulse-filters" class="pulse-filters">
        <select id="filter-source" class="pulse-filter-select" aria-label="Filter by source">
          <option value="">All sources</option>
        </select>
        <select id="filter-assetClass" class="pulse-filter-select" aria-label="Filter by asset class">
          <option value="">All classes</option>
        </select>
        <select id="filter-sentiment" class="pulse-filter-select" aria-label="Filter by sentiment">
          <option value="">All sentiment</option>
          <option value="positive">Positive</option>
          <option value="neutral">Neutral</option>
          <option value="negative">Negative</option>
        </select>
        <select id="filter-impact" class="pulse-filter-select" aria-label="Filter by impact">
          <option value="">All impact</option>
          <option value="0.7">High impact (≥0.7)</option>
          <option value="0.4">Medium+ impact (≥0.4)</option>
        </select>
        <input id="filter-ticker" class="pulse-filter-input" type="text" placeholder="Ticker (e.g. BTC)" aria-label="Filter by ticker" />
        <button id="filter-clear" class="pulse-filter-clear" type="button">Clear</button>
      </div>
      <div id="pulse-feed" class="pulse-feed">
        <p class="pulse-empty">Loading feed…</p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <span>Crypto Pulse</span>
    <span class="footer-sep">·</span>
    <span>RSS → RabbitMQ → Claude → Mercure</span>
    <span class="footer-sep">·</span>
    <span>Built on Oliva</span>
  </footer>

  <script type="module" src="src/pulse.js"></script>
</body>
</html>
